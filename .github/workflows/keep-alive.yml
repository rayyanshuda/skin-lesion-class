name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Streamlit App
        run: |
          echo "🏓 Pinging app at $(date)"
          curl -I https://skin-lesion-class.streamlit.app/
          echo "✅ Ping complete"
