steps:
  # Cloud Build's GitHub-trigger checkout may or may not resolve git-lfs
  # pointers automatically (unverified) -- resolve explicitly and fail loudly
  # if the model file turns out to be a pointer stub rather than the real
  # ~200MB weights, so a broken deploy is obvious at build time, not first
  # request time.
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update -qq && apt-get install -y -qq git-lfs
        git lfs install
        git lfs pull
        size=$(stat -c%s model/skin_lesion_model_final.keras)
        if [ "$size" -lt 5000000 ]; then
          echo "model/skin_lesion_model_final.keras is only ${size} bytes -- looks like an unresolved git-lfs pointer, not real weights."
          exit 1
        fi
        echo "Model file OK: ${size} bytes"
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/skin-lesion-class'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/skin-lesion-class'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skin-lesion-class'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/skin-lesion-class'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=2Gi'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/skin-lesion-class'
