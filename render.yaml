services:
  - type: web
    name: skin-lesion-class
    runtime: python
    buildCommand: |
      apt-get update && apt-get install -y git-lfs
      git lfs install
      git lfs pull
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: GIT_LFS_ENABLED
        value: "true"

# Note: Render's native Python runtime docs don't clearly document git-lfs support
# outside Docker-based deploys. If the `apt-get install git-lfs` build step doesn't
# work at actual deploy time, fall back to `runtime: docker` with a Dockerfile that
# installs git-lfs explicitly (e.g. FROM python:3.11-slim + apt-get install git-lfs).
